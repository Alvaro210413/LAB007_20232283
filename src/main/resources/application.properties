spring.application.name=lab4_gtics_20221

# La app abre en http://localhost:8080 (el index.html de static/ redirige a la lista de juegos)
server.port=8080

# Base de datos (cambia el usuario/contraseña por los de tu MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/gameshop3?serverTimezone=America/Lima
spring.datasource.username=root
