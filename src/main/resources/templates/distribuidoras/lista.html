<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!-- LISTA DE DISTRIBUIDORAS (3.1.2) | la abre listaDistribuidoras() del DistribuidorasController
     Funciona igual que juegos/lista.html -->
<head th:replace="~{fragments/base :: head('Lista de Distribuidoras')}"></head>
<body>
<div class="container">
    <nav th:replace="~{fragments/header :: navbar('distribuidoras')}"></nav>

    <h2 class="text-center">Lista de Distribuidoras</h2>

    <!-- botón que va a GET /distribuidoras/nuevo -->
    <a class="btn btn-primary btn-sm my-3" th:href="@{/distribuidoras/nuevo}">
        <i class="bi bi-plus-circle"></i> Nueva Distribuidora
    </a>

    <!-- Mensajes del controller: verde = msg, rojo = msgError -->
    <div th:if="${msg != null}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${msgError != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${msgError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <table class="table table-striped align-middle small">
        <thead>
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Fundación</th>
            <th>Sede</th>
            <th></th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <!-- una fila por cada distribuidora ("listaDistribuidoras" = nombre del model.addAttribute) -->
        <tr th:each="distribuidora, stat : ${listaDistribuidoras}">
            <td th:text="${stat.count}"></td>
            <!-- el nombre es un link a la web de la distribuidora -->
            <td><a class="link-secondary" th:href="${distribuidora.web}" target="_blank"
                   th:text="${distribuidora.nombre}"></a></td>
            <td th:text="${distribuidora.fundacion}"></td>
            <!-- sede es un país (entidad Paises), por eso .nombre -->
            <td th:text="${distribuidora.sede.nombre}"></td>
            <!-- editar y borrar, igual que en juegos -->
            <td>
                <a class="btn btn-primary btn-sm"
                   th:href="@{/distribuidoras/editar(id=${distribuidora.iddistribuidora})}">
                    <i class="bi bi-pencil-square"></i>
                </a>
            </td>
            <td>
                <a class="btn btn-danger btn-sm"
                   th:href="@{/distribuidoras/borrar(id=${distribuidora.iddistribuidora})}"
                   onclick="return confirm('¿Seguro que deseas borrar esta distribuidora?')">
                    <i class="bi bi-trash-fill"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
<th:block th:replace="~{fragments/base :: scripts}"></th:block>
</body>
</html>
